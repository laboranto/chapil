<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapil Design Tokens</title>
<style>
:root { color-scheme: light dark; --bg: #fcfcfc; --fg: #232629; --dim: #707d8a; --line: rgba(112,125,138,0.25); }
@media (prefers-color-scheme: dark) { :root { --bg: #141618; --fg: #fcfcfc; --dim: #a1a9b1; --line: rgba(161,169,177,0.25); } }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--fg); padding: 24px 16px 64px; line-height: 1.5; }
.wrap { max-width: 1000px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
h1 { font-size: 20px; font-weight: 700; }
h1 span { font-weight: 300; }
h2 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 32px 0 8px; }
.lead { color: var(--dim); font-size: 13px; margin-bottom: 8px; }
.lead code { font-family: ui-monospace, monospace; }
button { font: inherit; padding: 5px 14px; border: 1px solid var(--line); border-radius: 6px; background: none; color: inherit; cursor: pointer; }
button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
col.tok { width: 30%; }
th { text-align: left; font-weight: 600; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td:first-child { white-space: nowrap; }
.name { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; }
.desc { color: var(--dim); font-size: 12px; margin-top: 2px; max-width: 34ch; }
.cell { display: flex; align-items: center; gap: 7px; }
.sw { width: 26px; height: 26px; border-radius: 5px; border: 1px solid var(--line); flex: none; }
.sw.checker { background-image: linear-gradient(45deg, #bbb 25%, transparent 25%, transparent 75%, #bbb 75%), linear-gradient(45deg, #bbb 25%, #fff 25%, #fff 75%, #bbb 75%); background-size: 10px 10px; background-position: 0 0, 5px 5px; }
.sw.demo { display: grid; place-items: center; font-size: 9px; color: var(--dim); }
.sw.checker { position: relative; }
.fill { position: absolute; inset: 0; border-radius: inherit; }
.val { font-family: ui-monospace, monospace; font-size: 11px; color: var(--dim); word-break: break-all; }
.miss { color: #da4453; font-family: ui-monospace, monospace; font-size: 11px; }
.err { padding: 16px; border: 1px solid #da4453; border-radius: 6px; color: #da4453; font-size: 13px; }
.err code { font-family: ui-monospace, monospace; }
@media (max-width: 720px) { .desc { display: none; } .val { display: none; } }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Chapil <span>Design Tokens</span></h1>
  <div>
    <button id="light" aria-pressed="true">라이트</button>
    <button id="dark" aria-pressed="false">다크</button>
  </div>
</header>

<p class="lead">
  값은 <code>frontend/src/index.css</code>를 그대로 읽어 표시한다 — 이 페이지에 값을 따로
  적어두지 않으므로 낡지 않는다. OS 판별은 <code>frontend/src/theme.js</code>가 하고,
  결과가 <code>&lt;html data-theme&gt;</code>에 찍힌다.
</p>

<div id="out"></div>

</div>
<script type="module">
const CSS_URL = '../../frontend/src/index.css'

// index.css의 토큰 블록 셀렉터. 라이트/다크에서 breeze 셀렉터가 다른 이유는
// 다크의 맨 :root가 data-theme이 찍힌 경우까지 덮어쓰기 때문이다.
const THEMES = [
  { key: 'breeze',   label: 'Breeze',      light: ':root, [data-theme="breeze"]', dark: ':root:not([data-theme]), [data-theme="breeze"]' },
  { key: 'material', label: 'Material 3',  light: '[data-theme="material"]',      dark: '[data-theme="material"]' },
  { key: 'apple',    label: 'Liquid Glass',light: '[data-theme="apple"]',         dark: '[data-theme="apple"]' },
]

const DESC = {
  '--surface': '앱 전체의 기본 배경면. body에 직접 적용.',
  '--surface-variant': '콘텐츠 레이어의 보조 면. 입력창, 요약 타일, 코드 블록, 세그먼트 탭.',
  '--surface-elevated': '컨트롤·내비 레이어 전용. 바텀내비·팝오버·모달. --blur와 세트로 쓴다.',
  '--surface-fade': '그라디언트 끝점 전용. topbar·bottom-bg의 linear-gradient 종단점.',
  '--accent': '차필 시그니처 색. 테마·모드와 무관하게 하나다 — :root에 선언되어 세 열이 같다.',
  '--accent-press': '눌림(active) 상태 강조색. accent와 같은 색상·채도에서 명도만 낮춘 값.',
  '--on-accent': 'accent를 배경으로 깔았을 때 그 위의 글자·아이콘 색.',
  '--color-danger': '삭제·경고·위험 동작. 더보기 메뉴 삭제 버튼, 폼 에러 메시지.',
  '--color-success': '성공·긍정 상태. 배지 green 변형.',
  '--color-warning': '주의·점검 필요 상태. 배지 orange 변형.',
  '--on-surface': '기본 본문 텍스트. 제목·주요 내용.',
  '--on-surface-variant': '보조 텍스트. 라벨·날짜·메타 정보·placeholder.',
  '--state-hover': '마우스 올림 상태 배경. Breeze·Material은 accent 틴트, Apple은 HIG대로 중립 회색.',
  '--state-active': '눌림·선택 상태 배경. :active, .active에 적용.',
  '--outline': '카드 테두리, 목록 구분선, 섹션 경계.',
  '--outline-strong': '강조 테두리. 버튼(.btn), 입력창 포커스.',
  '--blur': 'backdrop-filter 전용값. Liquid Glass는 컨트롤·내비 레이어에만 — 콘텐츠 레이어에 바르지 말 것(HIG).',
  '--shadow': '기본 상태 그림자.',
  '--shadow-hover': 'hover 상태 그림자.',
  '--shadow-active': 'active 상태 그림자.',
  '--radius-sm': '입력창, 작은 카드, 드롭다운, 배지.',
  '--radius-lg': '바텀내비, 토스트 알림, 온보딩 버튼. Breeze는 알약 모양을 쓰지 않아 sm과 같다.',
  '--size-nav': '하단 블러 띠(.bottom-bg) 높이. 기록 추가 버튼을 덮는 크기.',
  '--size-layout': '콘텐츠 최대 너비. 태블릿·데스크탑 레이아웃을 제한.',
  '--safe-top': 'iOS 노치·Dynamic Island 상단 여백.',
  '--safe-bottom': 'iOS 홈 인디케이터 하단 여백.',
}

const GROUPS = [
  ['Surface',    ['--surface', '--surface-variant', '--surface-elevated', '--surface-fade']],
  ['Accent',     ['--accent', '--accent-press', '--on-accent']],
  ['Semantic',   ['--color-danger', '--color-success', '--color-warning']],
  ['Foreground', ['--on-surface', '--on-surface-variant']],
  ['State',      ['--state-hover', '--state-active']],
  ['Outline',    ['--outline', '--outline-strong']],
  ['Elevation',  ['--shadow', '--shadow-hover', '--shadow-active', '--blur']],
  ['Shape',      ['--radius-sm', '--radius-lg']],
  ['Layout',     ['--size-nav', '--size-layout', '--safe-top', '--safe-bottom']],
]

/** selector로 시작하는 블록 안의 { 토큰: 값 }. from 이후만 본다 */
function tokensOf(css, selector, from = 0) {
  const i = css.indexOf(selector + ' {', from)
  if (i < 0) return null
  const open = css.indexOf('{', i)
  const body = css.slice(open + 1, css.indexOf('}', open))
  const out = {}
  for (const [, k, v] of body.matchAll(/(--[\w-]+)\s*:\s*([^;]+);/g)) out[k] = v.trim()
  return out
}

const isColor = v => /^(#|rgba?\(|color-mix\()/.test(v)

function cell(value) {
  const td = document.createElement('td')
  if (value === undefined) {
    td.innerHTML = '<span class="miss">— 선언 없음</span>'
    return td
  }
  const wrap = document.createElement('div')
  wrap.className = 'cell'
  const sw = document.createElement('div')
  sw.className = 'sw'
  if (isColor(value)) {
    sw.classList.add('checker')          // 알파가 있는 값은 체커 위에 얹어야 보인다
    const fill = document.createElement('div')
    fill.className = 'fill'
    fill.style.background = value
    sw.append(fill)
  } else if (value.startsWith('blur(')) {
    sw.classList.add('demo'); sw.textContent = 'blur'; sw.style.backdropFilter = value
  } else if (value.includes('px') && value.includes('solid')) {
    sw.style.border = value
  } else if (/^\d+px$/.test(value)) {
    sw.style.borderRadius = value; sw.style.background = 'var(--line)'
  } else if (value.includes('rgba') || value.startsWith('0 ')) {
    sw.style.boxShadow = value; sw.style.background = 'var(--bg)'
  } else {
    sw.classList.add('demo'); sw.textContent = '—'
  }
  const val = document.createElement('div')
  val.className = 'val'
  val.textContent = value
  wrap.append(sw, val)
  td.append(wrap)
  return td
}

function render(css, mode) {
  // material/apple은 라이트·다크 셀렉터가 같다. 다크 값은 @media 뒤에만 있다.
  const from = mode === 'dark' ? css.indexOf('@media (prefers-color-scheme: dark)') : 0
  const sets = THEMES.map(t => tokensOf(css, t[mode], from))
  const structural = tokensOf(css, ':root')
  const out = document.getElementById('out')
  out.textContent = ''

  for (const [title, names] of GROUPS) {
    const h = document.createElement('h2'); h.textContent = title; out.append(h)
    const table = document.createElement('table')
    table.innerHTML = '<colgroup><col class="tok">' + THEMES.map(() => '<col>').join('') +
      '</colgroup><thead><tr><th>토큰</th>' +
      THEMES.map(t => `<th>${t.label}</th>`).join('') + '</tr></thead>'
    const tbody = document.createElement('tbody')
    for (const name of names) {
      const tr = document.createElement('tr')
      const head = document.createElement('td')
      head.innerHTML = `<div class="name">${name}</div><div class="desc">${DESC[name] ?? ''}</div>`
      tr.append(head)
      // 구조 토큰은 :root에 한 번만 있고 테마와 무관하다
      const shared = structural?.[name]
      for (const set of sets) tr.append(cell(shared ?? set?.[name]))
      tbody.append(tr)
    }
    table.append(tbody)
    out.append(table)
  }
}

const btn = { light: document.getElementById('light'), dark: document.getElementById('dark') }

try {
  const res = await fetch(CSS_URL)
  if (!res.ok) throw new Error(res.status)
  const css = await res.text()
  let mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
  const apply = () => {
    btn.light.setAttribute('aria-pressed', String(mode === 'light'))
    btn.dark.setAttribute('aria-pressed', String(mode === 'dark'))
    render(css, mode)
  }
  btn.light.onclick = () => { mode = 'light'; apply() }
  btn.dark.onclick  = () => { mode = 'dark';  apply() }
  apply()
} catch (e) {
  document.getElementById('out').innerHTML =
    `<p class="err">index.css를 읽지 못했다 (${e.message}).<br>
     <code>file://</code>로 열면 fetch가 막힌다. 저장소 루트에서
     <code>python -m http.server</code>를 띄우고
     <code>/docs/tokens/</code>로 접속할 것.</p>`
}
</script>
</body>
</html>
